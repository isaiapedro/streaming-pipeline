# Secure local-NATS profile. The certificate is generated locally and ignored.
port: 4222
http_port: 8222
jetstream { store_dir: "/data/jetstream" }
authorization {
  users: [{user: $NATS_USER, password: $NATS_PASSWORD}]
}
tls {
  cert_file: "/etc/nats/certs/nats-cert.pem"
  key_file: "/etc/nats/certs/nats-key.pem"
}
